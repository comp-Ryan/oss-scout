[project]
name = "oss-scout"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.0",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scout = "oss_scout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]
